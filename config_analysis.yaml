# =====================================================================
# Configuration for pupil_analysis.R
# Any key left out falls back to the default at the top of the script.
# =====================================================================

# Output of pupil_pipeline.py (or any file with the same structure)
input_csv: ../python_preprocessing/outputs/preprocessed_accepted_trials_long.csv
trial_qc_csv: ../python_preprocessing/outputs/trial_ledger.csv   # optional, for PART 0
output_dir: outputs
csv_sep: ","
csv_dec: "."

# Column names in the input file (right side)
columns:
  participant: participant
  trial: trial
  condition: condition
  time: time_ms            # time from stimulus onset, ms
  pupil: pupil_bc          # baseline-corrected pupil size

# Trial-level data-quality metrics tested in PART 0 (columns of trial_qc_csv)
qc_metrics: [pct_left, pct_right, coverage_ratio, pct_interpolated]

conditions:
  of_interest: Target
  reference: Distractor

gamm:
  k_condition: 20          # basis dimension of the by-condition smooths
  k_participant: 10        # basis dimension of the by-participant factor smooth

lmm:
  fixed_time_effect: false # false = model as in the manuscript; true adds a fixed slope for time
  agreement_tolerance: 0.20  # max relative gap between the LMM coefficient and the mean participant difference

features:                  # fix a priori (e.g. from prior literature)
  initial_window_ms: [0, 500]
  late_window_ms: [1000, .inf]

resampling:
  n_permutations: 5000
  n_bootstrap: 5000
  n_calibration_datasets: 100
  n_calibration_permutations: 199
  seed: 12345
  n_cores: null            # null = all available cores minus one
  timing_test: true        # print projected run time before each long loop

calibration_simulation:    # null datasets for PART 2c
  n_participants: 15
  n_trials_per_participant: 20
  n_samples_per_trial: 40
  prop_of_interest: 0.2    # match the proportion of trials in your condition of interest
  sample_step_ms: 30
  noise_sd: 0.02
  intercept_sd: 0.03
  rho_if_gamm_skipped: 0.95

parts:                     # switch parts on/off
  confound: true
  gamm: true
  lmm: true
  lmm_permutation: true
  lmm_calibration: true
  lmm_bootstrap: true
  features: true
  features_resampling: true
  loso: true

figure:
  font_family: Times
  width_in: 7
  height_in: 4.3
  accent_color: "#2166AC"
  ci_fill: grey75
